spring.application.name=unicofound
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/unicofound}
spring.datasource.username=${DB_USERNAME:unicofound}
spring.datasource.password=${DB_PASSWORD:unicofound}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.default_batch_fetch_size=20

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${DB_SCHEMA:public}
spring.liquibase.liquibase-schema=${DB_SCHEMA:public}

spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=20

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
