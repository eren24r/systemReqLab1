services:
  db:
    image: postgres:16-alpine
    container_name: unicofound-db
    environment:
      POSTGRES_DB: unicofound
      POSTGRES_USER: unicofound
      POSTGRES_PASSWORD: unicofound
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicofound -d unicofound"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: unicofound-app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/unicofound
      DB_USERNAME: unicofound
      DB_PASSWORD: unicofound
      DB_SCHEMA: public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
